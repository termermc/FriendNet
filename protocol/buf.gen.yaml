version: v2

plugins:
    - local: ../tool/bin/protoc-gen-go
      out: .
      opt: paths=source_relative
    - local: ../tool/bin/protoc-gen-connect-go
      out: .
      opt:
          - paths=source_relative
          - simple

managed:
    enabled: true
    disable:
        - file_option: go_package
          path: buf/validate
    override:
        - file_option: go_package_prefix
          value: friendnet.org/protocol